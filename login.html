<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GoBus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body">

    <!-- Header -->
    <header class="login-header d-flex align-items-center px-4 py-3">
        <a href="index.html" class="text-decoration-none d-flex align-items-center">
            <div class="d-flex align-items-center justify-content-center border border-2 border-white rounded-circle" style="width: 40px; height: 40px; margin-right: 12px;">
                <i class="fa-solid fa-bus text-white fs-5"></i>
            </div>
            <div class="text-white fw-bold fs-4">GoBus</div>
        </a>
    </header>

    <!-- Main Content -->
    <main class="login-main d-flex flex-column align-items-center justify-content-center flex-grow-1 py-5 position-relative z-1">
        
        <div class="card login-card shadow-sm border-0 p-4 p-md-5 mx-3">
            <div class="login-icon-wrapper mx-auto mb-3">
                <i class="fa-solid fa-bus-simple"></i>
            </div>
            
            <h3 class="fw-bold text-center mb-1 login-title">LogIn</h3>
            <p class="text-secondary text-center mb-4 pb-2">Login to your GoBus account</p>
            
            <form>
                <div class="mb-3">
                    <label class="form-label fw-semibold" style="font-size: 14px; color: #112240;">Email</label>
                    <div class="input-group login-input-group">
                        <input type="email" class="form-control border-start-0 ps-2" placeholder="Enter your email" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-semibold" style="font-size: 14px; color: #112240;">Password</label>
                    <div class="input-group login-input-group">
                        <input type="password" class="form-control border-start-0 border-end-0 ps-2" id="loginPassword" placeholder="Enter your password" required>
                        <span class="input-group-text bg-white border-start-0 text-muted pe-3" id="togglePassword" style="cursor: pointer;"><i class="fa-regular fa-eye" id="togglePasswordIcon"></i></span>
                    </div>
                </div>
                
                <button type="submit" class="btn w-100 py-2 mb-4 login-submit-btn fw-semibold">
                    Login
                </button>
                
                <div class="d-flex align-items-center mb-4">
                    <span class="mx-auto text-dark small">or</span>
                </div>
                
                <button type="button" class="btn w-100 py-2 d-flex align-items-center justify-content-center gap-2 google-btn text-dark fw-semibold">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" style="width: 20px;">
                    Sign up with Google
                </button>
            </form>
        </div>
        
    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
