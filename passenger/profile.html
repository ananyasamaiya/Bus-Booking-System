<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings - GoBus</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/passenger-dashboard.css">
</head>
<body class="passenger-body">

    
    <div id="navbar-container"></div>

    
    <main class="container py-5">
        
        <div class="profile-container">
            <h2 class="section-title text-center mb-4">Account Settings</h2>
            
            <div class="profile-card">
                
                
                <div class="avatar-wrapper">
                    <div class="avatar-circle">
                        <i class="fa-regular fa-user"></i>
                    </div>
                    <a href="#" class="change-photo-link">Change Photo</a>
                </div>

                <form>
                    
                    <h4 class="section-title fs-5">Personal Information</h4>
                    
                    <div class="row">
                        <div class="col-md-6 form-group-custom">
                            <label>Full Name</label>
                            <input type="text" class="form-control-custom" placeholder="e.g. John Doe" value="Rahul Sharma">
                        </div>
                        <div class="col-md-6 form-group-custom">
                            <label>Phone Number</label>
                            <input type="tel" class="form-control-custom" placeholder="+91 98765 43210" value="+91 98765 43210">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 form-group-custom">
                            <label>Home City</label>
                            <select class="form-control-custom">
                                <option>Mumbai</option>
                                <option>Delhi</option>
                                <option selected>Pune</option>
                                <option>Bangalore</option>
                                <option>Chennai</option>
                            </select>
                        </div>
                        <div class="col-md-6 form-group-custom">
                            <label>Date of Birth</label>
                            <input type="date" class="form-control-custom" value="1995-08-15">
                        </div>
                    </div>

                    
                    <div class="form-group-custom mt-2">
                        <label>Gender</label>
                        <div class="gender-selector">
                            <div class="gender-btn active" onclick="selectGender(this, 'Male')">
                                <i class="fa-solid fa-person"></i>
                                <span>Male</span>
                            </div>
                            <div class="gender-btn" onclick="selectGender(this, 'Female')">
                                <i class="fa-solid fa-person-dress"></i>
                                <span>Female</span>
                            </div>
                            <div class="gender-btn" onclick="selectGender(this, 'Other')">
                                <i class="fa-solid fa-users"></i>
                                <span>Other</span>
                            </div>
                        </div>
                        
                        <input type="hidden" id="selectedGender" value="Male">
                    </div>

                    <div class="profile-divider"></div>

                    
                    <h4 class="section-title fs-5">Security</h4>
                    
                    <div class="form-group-custom">
                        <label>Current Password</label>
                        <input type="password" class="form-control-custom" placeholder="Enter current password">
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 form-group-custom">
                            <label>New Password</label>
                            <input type="password" class="form-control-custom" placeholder="New password">
                        </div>
                        <div class="col-md-6 form-group-custom">
                            <label>Confirm Password</label>
                            <input type="password" class="form-control-custom" placeholder="Confirm new password">
                        </div>
                    </div>

                    
                    <div class="text-end mt-5">
                        <button type="button" class="btn btn-light px-4 py-2 fw-semibold me-2">Cancel</button>
                        <button type="submit" class="btn-royal px-5 py-2">Save Changes</button>
                    </div>

                </form>

            </div>
        </div>
        
    </main>

    
    <script>
function selectGender(element, genderValue) {
            const buttons = document.querySelectorAll('.gender-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            element.classList.add('active');
            
            document.getElementById('selectedGender').value = genderValue;
        }

        function logout() {
            localStorage.clear();
            window.location.href = '../index.html';
        }
    </script>
    <script src="js/navbar-loader.js"></script>
</body>
</html>
