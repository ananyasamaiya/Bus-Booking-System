<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings - GoBus</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/passenger-dashboard.css">
</head>
<body class="passenger-body">

    <!-- Navbar -->
    <nav class="passenger-navbar">
        <div class="container d-flex justify-content-between align-items-center py-3">
            <a href="dashboard.html" class="passenger-brand">
                <img src="https://t3.ftcdn.net/jpg/02/14/29/22/360_F_214292295_dsMiBAa83bToIrvyKXeXDJyZtaK0S2bv.jpg" alt="Logo" class="brand-logo-img">
                <div class="text-dark fw-bold fs-4">GoBus</div>
            </a>
            
            <div class="passenger-nav-links d-none d-md-flex align-items-center">
                <a href="dashboard.html">Home</a>
                <a href="dashboard.html">My Bookings</a>
                <a href="profile.html" class="active">Profile/Settings</a>
                <button class="logout-btn ms-2" onclick="logout()">Logout</button>
            </div>
            
            <!-- Mobile Menu Toggle -->
            <button class="btn d-md-none border-0 fs-4 text-secondary">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </nav>

    <!-- Main Workspace -->
    <main class="container py-5">
        
        <div class="profile-container">
            <h2 class="section-title text-center mb-4">Account Settings</h2>
            
            <div class="profile-card">
                
                <!-- Avatar Section -->
                <div class="avatar-wrapper">
                    <div class="avatar-circle">
                        <i class="fa-regular fa-user"></i>
                    </div>
                    <a href="#" class="change-photo-link">Change Photo</a>
                </div>

                <form>
                    <!-- Personal Information -->
                    <h4 class="section-title fs-5">Personal Information</h4>
                    
                    <div class="row">
                        <div class="col-md-6 form-group-custom">
                            <label>Full Name</label>
                            <input type="text" class="form-control-custom" placeholder="e.g. John Doe" value="Rahul Sharma">
                        </div>
                        <div class="col-md-6 form-group-custom">
                            <label>Phone Number</label>
                            <input type="tel" class="form-control-custom" placeholder="+91 98765 43210" value="+91 98765 43210">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 form-group-custom">
                            <label>Home City</label>
                            <select class="form-control-custom">
                                <option>Mumbai</option>
                                <option>Delhi</option>
                                <option selected>Pune</option>
                                <option>Bangalore</option>
                                <option>Chennai</option>
                            </select>
                        </div>
                        <div class="col-md-6 form-group-custom">
                            <label>Date of Birth</label>
                            <input type="date" class="form-control-custom" value="1995-08-15">
                        </div>
                    </div>

                    <!-- Gender Selection -->
                    <div class="form-group-custom mt-2">
                        <label>Gender</label>
                        <div class="gender-selector">
                            <div class="gender-btn active" onclick="selectGender(this, 'Male')">
                                <i class="fa-solid fa-person"></i>
                                <span>Male</span>
                            </div>
                            <div class="gender-btn" onclick="selectGender(this, 'Female')">
                                <i class="fa-solid fa-person-dress"></i>
                                <span>Female</span>
                            </div>
                            <div class="gender-btn" onclick="selectGender(this, 'Other')">
                                <i class="fa-solid fa-users"></i>
                                <span>Other</span>
                            </div>
                        </div>
                        <!-- Hidden input to store gender value for form submission -->
                        <input type="hidden" id="selectedGender" value="Male">
                    </div>

                    <div class="profile-divider"></div>

                    <!-- Security Section -->
                    <h4 class="section-title fs-5">Security</h4>
                    
                    <div class="form-group-custom">
                        <label>Current Password</label>
                        <input type="password" class="form-control-custom" placeholder="Enter current password">
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 form-group-custom">
                            <label>New Password</label>
                            <input type="password" class="form-control-custom" placeholder="New password">
                        </div>
                        <div class="col-md-6 form-group-custom">
                            <label>Confirm Password</label>
                            <input type="password" class="form-control-custom" placeholder="Confirm new password">
                        </div>
                    </div>

                    <!-- Submit -->
                    <div class="text-end mt-5">
                        <button type="button" class="btn btn-light px-4 py-2 fw-semibold me-2">Cancel</button>
                        <button type="submit" class="btn-royal px-5 py-2">Save Changes</button>
                    </div>

                </form>

            </div>
        </div>
        
    </main>

    <!-- Scripts -->
    <script>
function selectGender(element, genderValue) {
            // Remove active class from all buttons
            const buttons = document.querySelectorAll('.gender-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            // Add active class to clicked button
            element.classList.add('active');
            
            // Update hidden input
            document.getElementById('selectedGender').value = genderValue;
        }

        function logout() {
            localStorage.clear();
            window.location.href = '../index.html';
        }
    </script>
</body>
</html>
