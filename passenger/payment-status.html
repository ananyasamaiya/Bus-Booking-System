<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Status - GoBus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/passenger-dashboard.css">
    <link rel="stylesheet" href="../css/checkout-flow.css">
</head>
<body class="passenger-body">
    <div id="navbar-container"></div>

    <main class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
        <div class="card border-0 shadow-sm rounded-4 p-5 text-center" style="max-width: 500px; width: 100%;">
            
            <div id="processingState">
                <div class="spinner-border text-primary mb-4" style="width: 4rem; height: 4rem;" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <h4 class="fw-bold">Processing Payment</h4>
                <p class="text-secondary">Please do not close this window.</p>
            </div>

            <div id="successState" class="d-none">
                <div class="status-icon-wrapper status-success">
                    <i class="fa-solid fa-check fs-1"></i>
                </div>
                <h3 class="fw-bold mb-2">Booking Confirmed!</h3>
                <p class="text-secondary mb-4">Your ticket has been sent to your email.</p>
                <button class="btn btn-primary w-100 py-3 fw-bold mb-3" style="background-color: #1a43bf; border-radius: 8px;" onclick="window.location.href='e-ticket.html'">
                    View E-Ticket
                </button>
                <a href="dashboard.html" class="text-decoration-none text-secondary">Back to Dashboard</a>
            </div>

            <div id="failureState" class="d-none">
                <div class="status-icon-wrapper status-fail">
                    <i class="fa-solid fa-xmark fs-1"></i>
                </div>
                <h3 class="fw-bold mb-2">Payment Failed</h3>
                <p class="text-secondary mb-4">Don't worry, no money was deducted. Please try again.</p>
                <button class="btn btn-primary w-100 py-3 fw-bold mb-3" style="background-color: #1a43bf; border-radius: 8px;" onclick="window.location.href='checkout.html'">
                    Retry Payment
                </button>
                <a href="dashboard.html" class="text-decoration-none text-secondary">Back to Dashboard</a>
            </div>

        </div>
    </main>

    <script src="js/navbar-loader.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('processingState').classList.add('d-none');
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('status') === 'fail') {
                    document.getElementById('failureState').classList.remove('d-none');
                } else {
                    document.getElementById('successState').classList.remove('d-none');
                }
            }, 2000);
        });
    </script>
</body>
</html>
