<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoBus</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/index.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    </head>

  <body>
    
    <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 fixed-top">
      <div class="container-fluid px-4 px-lg-5">
        <a
          class="navbar-brand fw-bold text-primary brand-text d-flex align-items-center"
          href="#"
        >
          <img
            src="https://t3.ftcdn.net/jpg/02/14/29/22/360_F_214292295_dsMiBAa83bToIrvyKXeXDJyZtaK0S2bv.jpg"
            alt="Logo"
            class="brand-logo-img"
          />GoBus
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse justify-content-center"
          id="navbarNav"
        >
          <ul class="navbar-nav align-items-center" data-role-navigation>
            <li class="nav-item mx-3">
              <a
                class="nav-link active nav-link-custom fw-semibold"
                aria-current="page"
                href="index.html"
                >Home</a
              >
            </li>
            
            <li class="nav-item mx-3">
              <a class="nav-link nav-link-custom fw-semibold text-dark" href="about.html"
                >About Us</a
              >
            </li>
            <li class="nav-item mx-3">
              <a class="nav-link nav-link-custom fw-semibold text-dark" href="contact.html"
                >Contact Us</a
              >
            </li>
          </ul>
        </div>
        <div id="authActions" class="d-none d-lg-flex gap-2">
          <a
            href="signIn.html"
            class="btn btn-primary sign-in-btn px-4 py-2 fw-semibold"
            >SignIn</a
          >
          <a
            href="signUp.html"
            class="btn btn-primary sign-in-btn px-4 py-2 fw-semibold"
            >SignUp</a
          >
        </div>
      </div>
    </nav>

    <section
      class="hero-section position-relative d-flex align-items-center justify-content-center"
    >
      <div
        class="hero-overlay position-absolute w-100 h-100 top-0 start-0"
      ></div>
      <div class="hero-fade position-absolute w-100 bottom-0 start-0"></div>

      <div class="container text-center position-relative hero-content">
        <h1 class="text-white fw-bold display-4 mb-3">
          Your Next Journey, Just a Click Away
        </h1>
        <p class="text-white fs-5 mb-5 hero-subtitle">
          Book bus tickets in seconds. No lines, no stress, just smooth travels.
        </p>

        <div
          class="search-form-container bg-white p-4 mx-auto shadow rounded-4"
        >
          <form id="bookingForm" class="row g-3 align-items-end text-start">
            <div class="col-md-3">
              <label class="form-label text-secondary fw-semibold small mb-2"
                ><i class="fa-solid fa-location-dot me-1"></i>From</label
              >
              <input
                type="text"
                class="form-control custom-input"
                placeholder="Source City"
              />
            </div>
            <div class="col-md-3">
              <label class="form-label text-secondary fw-semibold small mb-2"
                ><i class="fa-solid fa-location-arrow me-1"></i>To</label
              >
              <input
                type="text"
                class="form-control custom-input"
                placeholder="Destination"
              />
            </div>
            <div class="col-md-3">
              <label class="form-label text-secondary fw-semibold small mb-2"
                ><i class="fa-regular fa-calendar me-1"></i>Date</label
              >
              <input
                type="date"
                class="form-control custom-input text-secondary"
              />
            </div>
            <div class="col-md-3">
              <button
                type="submit"
                class="btn btn-primary w-100 search-btn fw-bold d-flex align-items-center justify-content-center gap-2"
              >
                <i class="fa-solid fa-magnifying-glass"></i> Search Routes
              </button>
            </div>
          </form>
        </div>
      </div>
    </section>

    <footer class="footer-custom">
      <div class="footer-container">
        <div class="footer-top">
          <div class="footer-logo">
            <img
              src="https://t3.ftcdn.net/jpg/02/14/29/22/360_F_214292295_dsMiBAa83bToIrvyKXeXDJyZtaK0S2bv.jpg"
              alt="Logo"
              class="brand-logo-img"
            />
            <div>
              <div class="footer-brand">GoBus</div>
            </div>
          </div>

          <div class="footer-links">
            <a href="index.html">Home</a> <span>|</span> 
            <a href="#">Help Center</a> <span>|</span>
          </div>

          <div class="footer-social-wrapper">
            <div class="footer-social-title">Follow us</div>
            <div class="footer-socials">
              <a href="#"><i class="fa-brands fa-facebook"></i></a>
              <a href="#"><i class="fa-brands fa-instagram"></i></a>
              <a href="#"><i class="fa-brands fa-twitter"></i></a>
            </div>
          </div>
        </div>

        <div class="footer-divider"></div>

        <div class="footer-bottom">
          <div>&copy; 2026 GoBus. All rights reserved.</div>
          <div class="footer-bottom-links">
            <a href="#">Terms & Conditions</a> <span>|</span>
            <a href="#">Privacy Policy</a>
          </div>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
