<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - GoBus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="signup-body">

    <!-- Header -->
    <header class="signup-header d-flex align-items-center px-4 py-3">
        <a href="index.html" class="text-decoration-none d-flex align-items-center">
            <img src="https://t3.ftcdn.net/jpg/02/14/29/22/360_F_214292295_dsMiBAa83bToIrvyKXeXDJyZtaK0S2bv.jpg"
                 alt="Logo" style="height: 44px; margin-right: 15px; border-radius: 50%;">
            <div class="text-white">
                <div class="fw-bold fs-5 lh-1">GoBus</div>
            </div>
        </a>
    </header>

    <!-- Main Content -->
    <main class="container py-5 mt-4">
        <div class="text-center mb-5">
            <h1 class="fw-bold text-dark" style="color: #112240 !important;">Create Your Account</h1>
            <p class="text-secondary fs-5 mt-3">Choose how you want to register with GoBus</p>
        </div>

        <div class="row justify-content-center g-4 mx-auto" style="max-width: 900px;">
            <!-- Traveler Card -->
            <div class="col-md-6">
                <div class="card signup-card h-100 border-0 shadow-sm text-center p-5" >
                    <div class="icon-wrapper mx-auto mb-4 rounded-circle d-flex align-items-center justify-content-center">
                        <i class="fa-regular fa-user"></i>
                    </div>
                    <h3 class="fw-bold mb-3" style="color: #112240;">Traveler</h3>
                    <p class="text-secondary mb-5 px-3">Book tickets, explore routes and enjoy your journey.</p>
                    <button class="btn signup-role-btn w-100 py-3 fw-bold d-flex align-items-center justify-content-center gap-2 mt-auto">
                        Continue as Traveler
                    </button>
                </div>
            </div>
            
            <!-- Operator Card -->
            <div class="col-md-6">
                <div class="card signup-card h-100 border-0 shadow-sm text-center p-5">
                    <div class="icon-wrapper mx-auto mb-4 rounded-circle d-flex align-items-center justify-content-center">
                        <i class="fa-solid fa-bus-simple"></i>
                    </div>
                    <h3 class="fw-bold mb-3" style="color: #112240;">Operator</h3>
                    <p class="text-secondary mb-5 px-3">Manage your buses, schedules and grow your business.</p>
                    <button class="btn signup-role-btn w-100 py-3 fw-bold d-flex align-items-center justify-content-center gap-2 mt-auto">
                        Continue as Operator
                    </button>
                </div>
            </div>
        </div>
        
        <div class="text-center mt-5">
            <p class="text-secondary fs-6">Already have an account? <a href="login.html" class="fw-bold text-decoration-none" style="color: #1c56d8;">Sign In</a></p>
        </div>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
