<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - GoBus</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/signIn.css" />
  </head>
  <body class="login-body">
    
    <header class="login-header d-flex align-items-center px-4 py-3">
      <a
        href="index.html"
        class="text-decoration-none d-flex align-items-center"
      >
        <img
          src="https://t3.ftcdn.net/jpg/02/14/29/22/360_F_214292295_dsMiBAa83bToIrvyKXeXDJyZtaK0S2bv.jpg"
          alt="Logo"
          class="brand-logo-img"
        />
        <div class="text-white fw-bold fs-4">GoBus</div>
      </a>
    </header>

    <main
      class="login-main d-flex flex-column align-items-center justify-content-center flex-grow-1 py-5 position-relative z-1"
    >
      <div class="card login-card shadow-sm border-0 p-4 p-md-5 mx-3">
        <div class="login-icon-wrapper mx-auto mb-3">
          <i class="fa-solid fa-bus-simple"></i>
        </div>

        <h3 class="fw-bold text-center mb-1 login-title">Login</h3>
        <p class="text-secondary text-center mb-4 pb-2">
          Login to your GoBus account
        </p>

        <form id="loginForm" onsubmit="localStorage.setItem('isLoggedIn', 'true'); window.location.href='index.html'; return false;">
          <div class="mb-3">
            <label
              class="form-label fw-semibold form-label-custom"
              >Email</label
            >
            <div class="input-group login-input-group">
              <input
                type="email"
                id="loginEmail"
                class="form-control border-start-0 ps-2"
                placeholder="Enter your email"
                required
              />
            </div>
          </div>

          <div class="mb-4">
            <label
              class="form-label fw-semibold form-label-custom"
              >Password</label
            >
            <div class="input-group login-input-group">
              <input
                type="password"
                class="form-control border-start-0 border-end-0 ps-2"
                id="loginPassword"
                placeholder="Enter your password"
                required
              />
              <span
                class="input-group-text bg-white border-start-0 text-muted pe-3 cursor-pointer"
                id="togglePassword"
                ><i class="fa-regular fa-eye" id="togglePasswordIcon"></i
              ></span>
            </div>
          </div>

          <button
            type="submit"
            class="btn w-100 py-2 mb-4 login-submit-btn fw-semibold"
          >
            Login
          </button>

          <div class="d-flex align-items-center mb-4">
            <span class="mx-auto text-dark small">or</span>
          </div>

          <button
            type="button"
            class="btn w-100 py-2 d-flex align-items-center justify-content-center gap-2 google-btn text-dark fw-semibold"
          >
            <img
              src="https://www.svgrepo.com/show/475656/google-color.svg"
              alt="Google"
              class="google-icon-img"
            />
            Sign in with Google
          </button>

          <div class="text-center mt-4">
            <p class="text-secondary fs-6">
              Don't have an account?
              <a
                href="signUp.html"
                class="fw-bold text-decoration-none text-primary"
                >Create new account</a
              >
            </p>
          </div>
        </form>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
