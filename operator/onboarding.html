<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operator Verification - GoBus</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="bg-light">
    <main class="container py-5">
      <section
        class="bg-white shadow-sm rounded-3 p-4 p-md-5 mx-auto"
        style="max-width: 640px"
      >
        <p class="text-primary fw-semibold mb-1">OPERATOR VERIFICATION</p>
        <h1 class="h3 fw-bold">Complete your onboarding</h1>
        <p class="text-secondary">
          Upload your business documents before accessing the operator
          dashboard.
        </p>
        <form>
          <label class="form-label" for="businessLicense"
            >Business license</label
          ><input
            class="form-control mb-4"
            type="file"
            id="businessLicense"
            required
          /><button class="btn btn-primary" type="submit">
            Submit for review
          </button>
        </form>
      </section>
    </main>
      <script src="js/sidebar-loader.js"></script>
</body>
</html>
