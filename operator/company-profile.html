<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Profile - GoBus Operator</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/operator-dashboard.css">
</head>
<body class="dashboard-body">

    <div class="dashboard-layout">

        <div id="sidebar-container"></div>

        <div class="dashboard-main">

            <header class="dashboard-topbar justify-content-end">
                <div class="topbar-links d-none d-md-flex align-items-center">
                    <a href="dashboard-home.html">Home</a>
                    <a href="company-profile.html" class="active">Profile/Settings</a>
                    <a href="#" id="logoutBtn" class="logout-btn">Logout</a>
                </div>
            </header>

            <main class="dashboard-content">
                <h4 class="mb-4 text-deep-navy-bold">Profile Management</h4>

                <div class="profile-card">

                    <div class="company-header">
                        <div class="company-logo-placeholder">
                            <i class="fa-regular fa-image"></i>
                        </div>
                        <div>
                            <h2 style="font-weight: 800; color: var(--deep-navy); margin: 0; font-size: 28px;">Express Travels</h2>
                            <div class="verification-badge">Pending</div>
                        </div>
                    </div>

                    <div class="mb-5">
                        <h4 class="section-title">About Us</h4>
                        <textarea class="custom-textarea" rows="4" placeholder="Describe your company, fleet size, and service guarantees..."></textarea>
                    </div>

                    <div class="mb-5">
                        <h4 class="section-title">Photo Gallery</h4>
                        <div class="photo-gallery">
                            <div class="photo-placeholder">
                                <i class="fa-solid fa-camera fs-4"></i>
                                <span style="font-size: 13px;">Upload Image</span>
                            </div>
                            <div class="photo-placeholder">
                                <i class="fa-solid fa-camera fs-4"></i>
                                <span style="font-size: 13px;">Upload Image</span>
                            </div>
                        </div>
                    </div>

                    <div class="summary-box">
                        <h4 class="section-title">Company Standard Rate</h4>
                        <p style="font-size: 14px; color: #64748b; margin-bottom: 20px;">Configure your base pricing and markup percentages. These will apply across your fleet.</p>
                        
                        <div class="rate-grid">
                            <div class="rate-input-group">
                                <label>Base Fare per KM (₹)</label>
                                <input type="number" placeholder="e.g. 2.50" step="0.10">
                            </div>
                            <div class="rate-input-group">
                                <label>Holiday Markups (%)</label>
                                <input type="number" placeholder="e.g. 15">
                            </div>
                            <div class="rate-input-group">
                                <label>Meal & Blanket Add-on (₹)</label>
                                <input type="number" placeholder="e.g. 250">
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-4 text-end">
                        <button class="btn" style="background-color: var(--deep-navy); color: white; padding: 10px 24px; font-weight: 600; border-radius: 8px;">Save Changes</button>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script>
// Dropdown Logic
        function toggleDropdown() {
            const menu = document.getElementById('profileMenu');
            menu.classList.toggle('show');
        }

        // Close dropdown when clicking outside
        window.addEventListener('click', function(e) {
            const wrapper = document.querySelector('.profile-wrapper');
            if (wrapper && !wrapper.contains(e.target)) {
                document.getElementById('profileMenu').classList.remove('show');
            }
        });

        // Mock Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.clear();
            window.location.href = '../index.html';
        });
    </script>
    <script src="js/sidebar-loader.js"></script>
</body>
</html>
