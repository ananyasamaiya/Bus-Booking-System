<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop Configuration - GoBus Operator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/operator-dashboard.css">
</head>
<body class="dashboard-body">

    <div class="dashboard-layout">
        
        <!-- Left Sidebar (Deep Navy) -->
        <aside class="dashboard-sidebar">
            <div class="sidebar-logo d-flex align-items-center fs-20">
                <img src="https://t3.ftcdn.net/jpg/02/14/29/22/360_F_214292295_dsMiBAa83bToIrvyKXeXDJyZtaK0S2bv.jpg" alt="Logo" class="sidebar-brand-img">
                GoBus Operator
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard-home.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>
                <li><a href="routes.html" class="active"><i class="fa-solid fa-route"></i> Route Planning</a></li>
                <li><a href="#"><i class="fa-solid fa-list"></i> List Bus Record</a></li>
                <li><a href="#"><i class="fa-regular fa-calendar-alt"></i> Scheduling</a></li>
                <li><a href="#"><i class="fa-solid fa-ticket"></i> Booking Management</a></li>
            </ul>
        </aside>

        <!-- Main Content Area -->
        <div class="dashboard-main">
            
            <!-- Topbar (White) -->
            <header class="dashboard-topbar justify-content-end">
                <div class="topbar-links d-none d-md-flex align-items-center">
                    <a href="dashboard-home.html">Home</a>
                    <a href="company-profile.html">Profile/Settings</a>
                    <a href="#" id="logoutBtn" class="logout-btn">Logout</a>
                </div>
            </header>

            <!-- Workspace Content -->
            <main class="dashboard-content">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <a href="routes.html" class="btn btn-light border shadow-sm rounded-circle d-flex align-items-center justify-content-center btn-icon-40">
                        <i class="fa-solid fa-arrow-left"></i>
                    </a>
                    <h4 class="mb-0 text-deep-navy-bold">Stop Configuration</h4>
                </div>
                
                <div class="bg-white p-5 rounded-4 shadow-sm" style="border: 1px solid #e2e8f0; max-width: 800px; margin: 0 auto;">
                    
                    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                        <div>
                            <h5 class="fw-bold mb-1">Mumbai ➔ Delhi Route</h5>
                            <p class="text-secondary small mb-0">Configure stops and cumulative pricing from the source.</p>
                        </div>
                        
                        <div class="position-relative d-inline-block" data-bs-toggle="tooltip" data-bs-placement="left" title="Ticket Price = (Fare at Drop Stop) - (Fare at Boarding Stop)">
                            <i class="fa-solid fa-circle-info fs-5 text-primary" style="cursor: pointer;"></i>
                        </div>
                    </div>

                    <!-- Vertical Timeline for Stops -->
                    <div class="timeline-container ps-3 pe-3 pb-4">
                        
                        <!-- Stop 1 (Source) -->
                        <div class="timeline-item">
                            <div class="timeline-node source-node"></div>
                            <div class="timeline-content row align-items-center bg-light p-3 rounded-3 mb-3 border">
                                <div class="col-md-5 d-flex align-items-center gap-3">
                                    <input class="form-check-input fs-5" type="checkbox" checked disabled>
                                    <h6 class="fw-bold mb-0">Mumbai (Source)</h6>
                                </div>
                                <div class="col-md-7 d-flex align-items-center justify-content-end gap-2">
                                    <label class="small text-secondary fw-semibold">Cumulative Fare (₹):</label>
                                    <input type="number" class="form-control fw-bold text-center" value="0" disabled style="width: 100px; background-color: #e2e8f0;">
                                </div>
                            </div>
                        </div>

                        <!-- Stop 2 -->
                        <div class="timeline-item">
                            <div class="timeline-node"></div>
                            <div class="timeline-content row align-items-center bg-white p-3 rounded-3 mb-3 border hover-shadow transition">
                                <div class="col-md-5 d-flex align-items-center gap-3">
                                    <input class="form-check-input fs-5" type="checkbox" checked id="stop1">
                                    <label class="fw-bold mb-0 text-dark" for="stop1" style="cursor: pointer;">Surat</label>
                                </div>
                                <div class="col-md-7 d-flex align-items-center justify-content-end gap-2">
                                    <label class="small text-secondary fw-semibold">Cumulative Fare (₹):</label>
                                    <input type="number" class="form-control fw-bold text-center border-primary text-primary" value="400" style="width: 100px;">
                                </div>
                            </div>
                        </div>

                        <!-- Stop 3 -->
                        <div class="timeline-item">
                            <div class="timeline-node"></div>
                            <div class="timeline-content row align-items-center bg-white p-3 rounded-3 mb-3 border hover-shadow transition">
                                <div class="col-md-5 d-flex align-items-center gap-3">
                                    <input class="form-check-input fs-5" type="checkbox" checked id="stop2">
                                    <label class="fw-bold mb-0 text-dark" for="stop2" style="cursor: pointer;">Ahmedabad</label>
                                </div>
                                <div class="col-md-7 d-flex align-items-center justify-content-end gap-2">
                                    <label class="small text-secondary fw-semibold">Cumulative Fare (₹):</label>
                                    <input type="number" class="form-control fw-bold text-center border-primary text-primary" value="750" style="width: 100px;">
                                </div>
                            </div>
                        </div>

                        <!-- Stop 4 -->
                        <div class="timeline-item">
                            <div class="timeline-node"></div>
                            <div class="timeline-content row align-items-center bg-white p-3 rounded-3 mb-3 border hover-shadow transition">
                                <div class="col-md-5 d-flex align-items-center gap-3">
                                    <input class="form-check-input fs-5" type="checkbox" id="stop3">
                                    <label class="fw-bold mb-0 text-secondary" for="stop3" style="cursor: pointer;">Udaipur (Skipped)</label>
                                </div>
                                <div class="col-md-7 d-flex align-items-center justify-content-end gap-2">
                                    <label class="small text-secondary fw-semibold">Cumulative Fare (₹):</label>
                                    <input type="number" class="form-control text-center text-muted bg-light" value="0" disabled style="width: 100px;">
                                </div>
                            </div>
                        </div>

                        <!-- Stop 5 -->
                        <div class="timeline-item">
                            <div class="timeline-node"></div>
                            <div class="timeline-content row align-items-center bg-white p-3 rounded-3 mb-3 border hover-shadow transition">
                                <div class="col-md-5 d-flex align-items-center gap-3">
                                    <input class="form-check-input fs-5" type="checkbox" checked id="stop4">
                                    <label class="fw-bold mb-0 text-dark" for="stop4" style="cursor: pointer;">Jaipur</label>
                                </div>
                                <div class="col-md-7 d-flex align-items-center justify-content-end gap-2">
                                    <label class="small text-secondary fw-semibold">Cumulative Fare (₹):</label>
                                    <input type="number" class="form-control fw-bold text-center border-primary text-primary" value="1300" style="width: 100px;">
                                </div>
                            </div>
                        </div>

                        <!-- Stop 6 (Destination) -->
                        <div class="timeline-item">
                            <div class="timeline-node dest-node"></div>
                            <div class="timeline-content row align-items-center bg-light p-3 rounded-3 mb-3 border">
                                <div class="col-md-5 d-flex align-items-center gap-3">
                                    <input class="form-check-input fs-5" type="checkbox" checked disabled>
                                    <h6 class="fw-bold mb-0">Delhi (Destination)</h6>
                                </div>
                                <div class="col-md-7 d-flex align-items-center justify-content-end gap-2">
                                    <label class="small text-secondary fw-semibold">Cumulative Fare (₹):</label>
                                    <input type="number" class="form-control fw-bold text-center border-primary text-primary bg-white" value="1800" style="width: 100px;">
                                </div>
                            </div>
                        </div>

                        <!-- Add Stop Button -->
                        <div class="d-flex justify-content-center mt-4">
                            <button class="btn btn-outline-secondary rounded-pill fw-semibold px-4" data-bs-toggle="modal" data-bs-target="#addStopModal">
                                <i class="fa-solid fa-plus me-2"></i> Add Another Stop
                            </button>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end mt-5 pt-3 border-top gap-3">
                        <a href="routes.html" class="btn btn-light fw-bold px-4 py-2 border shadow-sm">Cancel</a>
                        <button id="submitSaveBtn" class="btn btn-primary fw-bold px-5 py-2 shadow-sm" style="background-color: var(--emerald-green); border-color: var(--emerald-green);">
                            Submit & Save Route
                        </button>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <!-- Add Stop Modal -->
    <div class="modal fade" id="addStopModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-bottom-0 pb-0 px-4 pt-4">
                    <h5 class="modal-title fw-bold text-deep-navy">Add New Stop</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body px-4 py-4">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-secondary">Stop Name</label>
                        <input type="text" id="newStopName" class="form-control" placeholder="e.g. Pune">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-secondary">Cumulative Fare (₹)</label>
                        <input type="number" id="newStopFare" class="form-control" placeholder="e.g. 500">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-secondary">Insert After (Sequence)</label>
                        <select id="newStopSequence" class="form-select">
                            <option value="0">Mumbai (Source)</option>
                            <option value="1">Surat</option>
                            <option value="2">Ahmedabad</option>
                            <option value="3">Udaipur</option>
                            <option value="4" selected>Jaipur</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer border-top-0 px-4 pb-4">
                    <button type="button" class="btn btn-secondary rounded-3" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="confirmAddStopBtn" class="btn btn-primary rounded-3" style="background-color: var(--deep-navy);" data-bs-dismiss="modal">Add Stop</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
// Initialize tooltips
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
        var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl)
        })

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            window.location.href = '../index.html';
        });

        // Toggle state for checkboxes
        function bindCheckbox(chk) {
            chk.addEventListener('change', (e) => {
                if(!e.target.disabled) {
                    const row = e.target.closest('.timeline-content');
                    const label = row.querySelector('label');
                    const input = row.querySelector('input[type="number"]');
                    if(e.target.checked) {
                        label.classList.remove('text-secondary');
                        label.classList.add('text-dark');
                        input.disabled = false;
                        input.classList.remove('text-muted', 'bg-light');
                        input.classList.add('border-primary', 'text-primary');
                        label.innerText = label.innerText.replace(' (Skipped)', '');
                    } else {
                        label.classList.add('text-secondary');
                        label.classList.remove('text-dark');
                        input.disabled = true;
                        input.classList.add('text-muted', 'bg-light');
                        input.classList.remove('border-primary', 'text-primary');
                        if(!label.innerText.includes('(Skipped)')) {
                            label.innerText += ' (Skipped)';
                        }
                    }
                }
            });
        }
        
        document.querySelectorAll('.timeline-content input[type="checkbox"]').forEach(bindCheckbox);

        // Add Another Stop functionality via Modal
        document.getElementById('confirmAddStopBtn').addEventListener('click', () => {
            const name = document.getElementById('newStopName').value || 'New Stop';
            const fare = document.getElementById('newStopFare').value || '0';
            const seqIndex = parseInt(document.getElementById('newStopSequence').value, 10);
            
            const container = document.querySelector('.timeline-container');
            const items = container.querySelectorAll('.timeline-item');
            
            const newStopDiv = document.createElement('div');
            newStopDiv.className = 'timeline-item';
            newStopDiv.innerHTML = `
                <div class="timeline-node"></div>
                <div class="timeline-content row align-items-center bg-white p-3 rounded-3 mb-3 border hover-shadow transition">
                    <div class="col-md-5 d-flex align-items-center gap-3">
                        <input class="form-check-input fs-5" type="checkbox" checked id="new_stop_${Date.now()}">
                        <label class="fw-bold mb-0 text-dark" for="new_stop_${Date.now()}" style="cursor: pointer;">${name}</label>
                    </div>
                    <div class="col-md-7 d-flex align-items-center justify-content-end gap-2">
                        <label class="small text-secondary fw-semibold">Cumulative Fare (₹):</label>
                        <input type="number" class="form-control fw-bold text-center border-primary text-primary" value="${fare}" style="width: 100px;">
                    </div>
                </div>
            `;
            
            // Insert after the chosen sequence node
            if (seqIndex < items.length - 1) {
                // items[seqIndex] is the item we want to insert after.
                // so we insert before items[seqIndex + 1]
                container.insertBefore(newStopDiv, items[seqIndex + 1]);
            } else {
                // fallback to inserting before destination
                container.insertBefore(newStopDiv, items[items.length - 1]);
            }
            
            // bind checkbox logic for new node
            bindCheckbox(newStopDiv.querySelector('input[type="checkbox"]'));
            
            // Optionally update the select dropdown to include this new stop for future additions
            // (keeping it simple for now)
        });

        // Submit & Save Route
        document.getElementById('submitSaveBtn').addEventListener('click', () => {
            alert('Route successfully saved! Changes have been reflected.');
            window.location.href = 'routes.html';
        });
    </script>
</body>
</html>
