<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Route - GoBus Operator</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/operator-dashboard.css">
    <link rel="stylesheet" href="../css/add-route.css">
</head>
<body class="dashboard-body">

    <div class="dashboard-layout">

        <div id="sidebar-container"></div>

        <div class="dashboard-main">

            <header class="dashboard-topbar" style="justify-content: flex-end;">
                <div class="topbar-links d-none d-md-flex align-items-center">
                    <a href="dashboard-home.html">Home</a>
                    <a href="company-profile.html">Profile/Settings</a>
                    <a href="#" id="logoutBtn" class="logout-btn">Logout</a>
                </div>
            </header>

            <main class="dashboard-content d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 70px);">
                
                <div class="add-route-card bg-white p-5 rounded-4 shadow-sm w-100" style="max-width: 800px; border: 1px solid #e2e8f0; position: relative;">
                    
                    <a href="routes.html" class="position-absolute text-secondary" style="top: 20px; right: 25px; font-size: 24px;">
                        <i class="fa-solid fa-times-circle"></i>
                    </a>

                    <h4 class="fw-bold mb-5 text-center" style="color: var(--deep-navy);">Add New Route</h4>
                    
                    <div class="d-flex flex-column flex-md-row align-items-center justify-content-center gap-4">
                        <div class="flex-grow-1 position-relative w-100">
                            <label class="form-label fw-semibold text-secondary small mb-1 px-2">FROM</label>
                            <select class="form-select search-dropdown-custom w-100 py-2">
                                <option selected>Select Origin</option>
                                <option>Mumbai</option>
                                <option>Delhi</option>
                                <option>Bangalore</option>
                            </select>
                        </div>
                        
                        <div class="exchange-icon text-secondary" style="font-size: 24px; margin-top: 15px;">
                            <i class="fa-solid fa-right-left"></i>
                        </div>

                        <div class="flex-grow-1 position-relative w-100">
                            <label class="form-label fw-semibold text-secondary small mb-1 px-2">TO</label>
                            <select class="form-select search-dropdown-custom w-100 py-2">
                                <option selected>Select Destination</option>
                                <option>Mumbai</option>
                                <option>Delhi</option>
                                <option>Bangalore</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-center mt-5">
                        <a href="select-route.html" class="btn btn-primary fw-bold px-5 py-3 shadow-sm rounded-3" style="background-color: var(--deep-navy); border-color: var(--deep-navy); font-size: 16px;">
                            Search Routes
                        </a>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script>
document.getElementById('logoutBtn').addEventListener('click', () => {
            window.location.href = '../index.html';
        });
    </script>
    <script src="js/sidebar-loader.js"></script>
</body>
</html>
